[project]
name = "projeto-jule"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Felipe", email = "feliperobertobacchi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
projeto-jule = "projeto_jule:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
